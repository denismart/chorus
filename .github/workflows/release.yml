name: Release

# По тегу v* собирает аддон BigWigs Packager и публикует релиз на GitHub.
# На CurseForge и Wago выкладывает, когда в Chorus.toc есть X-Curse-Project-ID / X-Wago-ID,
# а в секретах репозитория заданы CF_API_KEY / WAGO_API_TOKEN.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
